name: model-pipeline

# IFC → web GLB for the 3D plan viewer, plus the photoreal turntable,
# unattended. Give it an IFC (a URL, or the slug of a `model3d` document
# — the Studio's "3D models" — whose `sourceModel` file is the IFC) and:
#
#   convert  runs scripts/model/ifc-to-glb.py + gltf-transform, commits
#            public/models/<slug>.glb + design/models/<slug>.report.json
#            to main and — when SANITY_AUTH_TOKEN can write — uploads the
#            GLB to the dataset and attaches it to the plan's `model` field
#   render   (optional) renders the Cycles turntable + plan-cut frames
#            with Blender as a Python module, SHARDED across parallel
#            runner jobs (a frame is ~2.5 min on a runner; six shards turn
#            a 96-frame set around in under an hour), with a Poly Haven
#            sky + PBR sets fetched through its API
#   encode   merges the shards, encodes AVIF/WebP + poster + manifest with
#            scripts/model/encode-frames.mjs and commits the frames folder
#
# The sandbox cannot reach sanity.io, polyhaven.com or most hosts, so this
# is where the pipeline runs for real. Dispatch from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "3D model slug (names the output; the model3d document with this slug supplies the IFC when ifc_url is empty). May be nested, e.g. sample/basic-house"
        required: true
      ifc_url:
        description: "URL of the IFC to convert (optional when the 3D model document has a Source model)"
        required: false
      allow:
        description: "Comma list of element names/GlobalIds to keep even if small"
        required: false
      deny:
        description: "Comma list of element names/GlobalIds to drop"
        required: false
      attach:
        description: "Upload the GLB to Sanity and attach it to the 3D model document (needs a write token)"
        type: boolean
        default: true
      render:
        description: "Also render the Cycles turntable + plan-cut frames"
        type: boolean
        default: true
      frames:
        description: "Orbit frame count for the render (72 = 5° steps, smooth to drag)"
        required: false
        default: "72"
      plan_frames:
        description: "Frames in the flight-and-cut sequence to the floor plan"
        required: false
        default: "24"
      samples:
        description: "Cycles samples per pixel for the render"
        required: false
        default: "64"
      frames_dir:
        description: "Where the encoded frames go (default public/models/<slug>/turntable; the sample uses public/models/sample/turntable)"
        required: false
      env:
        description: "Also refresh public/models/env (the raster viewer's web-sized copy of the render HDRI + sun direction)"
        type: boolean
        default: true
      bake:
        description: "Bake real materials (Poly Haven PBR sets by material class) + an ambient-occlusion atlas into the web GLB (off: the viewer's procedural finishes — Bryce, 2026-10-09)"
        type: boolean
        default: false
      ao_size:
        description: "Ambient-occlusion atlas size in px for the bake (2048 is ~3 cm/texel on a 50 m home)"
        required: false
        default: "2048"

permissions:
  contents: write

env:
  # the ONE sky both viewers use (Poly Haven id): renders light with it and
  # the env job copies it to public/models/env (sky.yml can also install
  # one directly). meadow_2: sun, blue sky, a ring of green trees — the
  # windows reflect sky over trees (Bryce, 2026-10-05).
  SKY_ID: meadow_2
  SANITY_PROJECT_ID: i2wd5pr1
  SANITY_DATASET: production
  SANITY_API_VERSION: "2026-07-01"

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      north: ${{ steps.report.outputs.north }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pipeline
        run: python -m pip install -q ifcopenshell trimesh numpy scipy shapely networkx mapbox-earcut manifold3d

      - name: Resolve the IFC source
        id: src
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.ifc_url }}"
          if [ -z "$URL" ]; then
            URL=$(curl -sS "https://$SANITY_PROJECT_ID.api.sanity.io/v$SANITY_API_VERSION/data/query/$SANITY_DATASET?query=$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "*[_type in [\"model3d\",\"plan\"] && slug.current==\"${{ github.event.inputs.slug }}\" && defined(sourceModel)][0]{ \"url\": sourceModel.asset->url }")" -H "Authorization: Bearer $SANITY_AUTH_TOKEN" | python -c 'import json,sys; r=json.load(sys.stdin)["result"]; print((r or {}).get("url") or "")')
          fi
          [ -n "$URL" ] || { echo "no IFC: pass ifc_url or upload a Source model (IFC) on the 3D model document with this slug"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # keep the IFC's siding materials when the 3D model document says so (default on for model3d)
          KEEP=$(curl -sS "https://$SANITY_PROJECT_ID.api.sanity.io/v$SANITY_API_VERSION/data/query/$SANITY_DATASET?query=$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "*[_type==\"model3d\" && slug.current==\"${{ github.event.inputs.slug }}\"][0].keepMaterials")" -H "Authorization: Bearer $SANITY_AUTH_TOKEN" | python -c 'import json,sys; r=json.load(sys.stdin)["result"]; print("true" if r is not False and r is not None else "false")' 2>/dev/null || echo false)
          echo "keep_materials=$KEEP" >> "$GITHUB_OUTPUT"
          echo "keep materials: $KEEP"
          curl -sS -L -o source.ifc "$URL"
          ls -la source.ifc

      - name: Convert
        run: |
          set -euo pipefail
          SLUG="${{ github.event.inputs.slug }}"
          mkdir -p "$(dirname "public/models/$SLUG.glb")" "$(dirname "design/models/$SLUG.report.json")"
          python scripts/model/ifc-to-glb.py source.ifc /tmp/source.raw.glb --report "design/models/$SLUG.report.json" \
            $([ "${{ steps.src.outputs.keep_materials }}" = "true" ] && echo --keep-materials) \
            ${{ github.event.inputs.allow && format('--allow "{0}"', github.event.inputs.allow) || '' }} \
            ${{ github.event.inputs.deny && format('--deny "{0}"', github.event.inputs.deny) || '' }}
          cp /tmp/source.raw.glb /tmp/web.glb

      # ---- BAKE (Bryce, 2026-10-09: "wood grains, concrete textures, AO"):
      #      Blender as a module gives every node a real PBR set by its
      #      material class and bakes an occlusion atlas; the raw GLB's
      #      extras are carried back over afterwards
      - name: Install Blender (bpy) for the bake
        if: ${{ github.event.inputs.bake == 'true' }}
        run: python -m pip install -q bpy==4.5.14
      - name: Fetch PBR sets by material class (Poly Haven, CC0)
        if: ${{ github.event.inputs.bake == 'true' }}
        run: |
          set -uo pipefail
          # each class tries its candidates in order (the catalogue shifts);
          # a class with no download stays a flat colour in the bake
          fetch() { # fetch <asset-id> <key/path/in/json> <out-file>
            url=$(curl -sS "https://api.polyhaven.com/files/$1" | python -c 'import json,sys,functools; print(functools.reduce(lambda a,k: a[k], sys.argv[1].split("/"), json.load(sys.stdin))["url"])' "$2" 2>/dev/null || true)
            [ -n "$url" ] && curl -sS -f -L -o "$3" "$url" && echo "  $1 ($2) → $3 $(stat -c %s "$3") B" && return 0
            rm -f "$3"; return 1
          }
          fetch_set() { # fetch_set <class> <candidate ids…>
            local cls="$1"; shift; local out="/tmp/assets/$cls"; mkdir -p "$out"
            for id in "$@"; do
              if fetch "$id" Diffuse/1k/jpg "$out/diff.jpg"; then
                fetch "$id" nor_gl/1k/jpg "$out/nor.jpg" || true
                fetch "$id" Rough/1k/jpg "$out/rough.jpg" || true
                echo "$cls ← $id"; return 0
              fi
            done
            echo "$cls: no candidate available"; return 0
          }
          fetch_set wood wood_table_001 rough_wood dark_wood oak_veneer_01 weathered_planks wood_floor_deck
          fetch_set plywood plywood oak_veneer_01 wood_table_001
          fetch_set plaster painted_plaster_wall plastered_wall_02 plaster_wall_02 white_plaster_02
          fetch_set concrete concrete_wall_008 concrete_wall_006 concrete_wall_007 rough_concrete concrete_layers_02
          fetch_set floor concrete_floor_worn_001 concrete_floor_02 concrete_floor_painted
          fetch_set metal metal_plate painted_metal_shutter corrugated_iron_03
          du -sh /tmp/assets/* || true
      - name: Bake materials + ambient occlusion
        if: ${{ github.event.inputs.bake == 'true' }}
        run: |
          set -euo pipefail
          SLUG="${{ github.event.inputs.slug }}"
          python scripts/model/bake.py /tmp/source.raw.glb /tmp/baked.glb --textures /tmp/assets --ao "${{ github.event.inputs.ao_size }}" --report /tmp/bake.json
          # gltf-transform in a scratch package (not the repo's full install)
          mkdir -p /tmp/gt && cp scripts/model/carry-extras.mjs /tmp/gt/
          (cd /tmp/gt && npm init -y > /dev/null && npm i --no-audit --no-fund @gltf-transform/core@4 @gltf-transform/extensions@4 > /dev/null)
          node /tmp/gt/carry-extras.mjs /tmp/source.raw.glb /tmp/baked.glb /tmp/web.glb /tmp/bake.json
          python - <<'PY'
          import json
          slug = "${{ github.event.inputs.slug }}"
          r = json.load(open(f"design/models/{slug}.report.json"))
          r["bake"] = json.load(open("/tmp/bake.json"))
          json.dump(r, open(f"design/models/{slug}.report.json", "w"), indent=2)
          PY

      - name: Optimise the web model
        id: report
        run: |
          set -euo pipefail
          SLUG="${{ github.event.inputs.slug }}"
          # textures (when baked) go WebP at ≤1k: a set is ~100 KB a map
          npx -y @gltf-transform/cli@4 optimize /tmp/web.glb "public/models/$SLUG.glb" --compress meshopt --texture-compress webp --texture-size 1024 --simplify-error 0.001 --palette false --join false --flatten false
          ls -la "public/models/$SLUG.glb"
          python - <<'PY'
          import json, os
          slug = "${{ github.event.inputs.slug }}"
          r = json.load(open(f"design/models/{slug}.report.json"))
          r["compressedBytes"] = os.path.getsize(f"public/models/{slug}.glb")
          json.dump(r, open(f"design/models/{slug}.report.json", "w"), indent=2)
          print(f"kept {sum(r['kept'].values())} / dropped {sum(r['dropped'].values())} · {r['triangles']:,} tris · {r['compressedBytes']/1024:.0f} KB · storeys {len(r['storeys'])} · north {r['northDeg']}°")
          if r["proxies"]:
              print("proxies:", ", ".join(f"{p['name']} ({p['size_m']} m) {'kept' if p['kept'] else 'dropped'}" for p in r["proxies"]))
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"north={r['northDeg']}\n")
          PY

      - name: Keep the uncompressed model for the render shards
        if: ${{ github.event.inputs.render == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: model-raw
          path: /tmp/source.raw.glb
          retention-days: 1

      - name: Attach to the 3D model document in Sanity
        if: ${{ github.event.inputs.attach == 'true' && env.SANITY_AUTH_TOKEN != '' }}
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          SLUG="${{ github.event.inputs.slug }}"
          ASSET=$(curl -sS -X POST "https://$SANITY_PROJECT_ID.api.sanity.io/v$SANITY_API_VERSION/assets/files/$SANITY_DATASET?filename=$(basename "$SLUG").glb" \
            -H "Authorization: Bearer $SANITY_AUTH_TOKEN" -H "Content-Type: model/gltf-binary" --data-binary "@public/models/$SLUG.glb" | python -c 'import json,sys; print(json.load(sys.stdin)["document"]["_id"])')
          NORTH=$(python -c "import json; print(json.load(open('design/models/$SLUG.report.json'))['northDeg'])")
          ID=$(curl -sS "https://$SANITY_PROJECT_ID.api.sanity.io/v$SANITY_API_VERSION/data/query/$SANITY_DATASET?query=$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "*[_type in [\"model3d\",\"plan\"] && slug.current==\"$SLUG\"] | order(_type asc)[0]._id")" -H "Authorization: Bearer $SANITY_AUTH_TOKEN" | python -c 'import json,sys; print(json.load(sys.stdin)["result"] or "")')
          [ -n "$ID" ] || { echo "no 3D model (or plan) document with slug $SLUG — GLB committed, not attached"; exit 0; }
          curl -sS -X POST "https://$SANITY_PROJECT_ID.api.sanity.io/v$SANITY_API_VERSION/data/mutate/$SANITY_DATASET" \
            -H "Authorization: Bearer $SANITY_AUTH_TOKEN" -H "Content-Type: application/json" \
            -d "{\"mutations\":[{\"patch\":{\"id\":\"$ID\",\"set\":{\"model\":{\"_type\":\"file\",\"asset\":{\"_type\":\"reference\",\"_ref\":\"$ASSET\"}},\"northDeg\":$NORTH}}}]}" | head -c 300; echo
          echo "attached $ASSET to $ID"

      - name: Commit the model and report
        run: |
          set -euo pipefail
          SLUG="${{ github.event.inputs.slug }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/models/$SLUG.glb" "design/models/$SLUG.report.json"
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "models: $SLUG (ifc-to-glb pipeline)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main

  render:
    needs: convert
    if: ${{ github.event.inputs.render == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: model-raw
          path: /tmp/model
      - name: Install Blender (bpy)
        run: python -m pip install -q bpy==4.5.14

      - name: Fetch the sky and textures (Poly Haven, CC0)
        run: |
          set -uo pipefail
          # through api.polyhaven.com/files/<id>; each asset is optional — a
          # missing download leaves that material procedural
          mkdir -p /tmp/assets/siding /tmp/assets/roof /tmp/assets/concrete
          fetch() { # fetch <asset-id> <key/path/in/json> <out-file>
            url=$(curl -sS "https://api.polyhaven.com/files/$1" | python -c 'import json,sys,functools; print(functools.reduce(lambda a,k: a[k], sys.argv[1].split("/"), json.load(sys.stdin))["url"])' "$2" 2>/dev/null || true)
            if [ -n "$url" ] && curl -sS -L -o "$3" "$url"; then echo "  $1 ($2) → $3 $(stat -c %s "$3") B"; else echo "  $1 ($2) unavailable"; rm -f "$3"; fi
          }
          fetch "$SKY_ID" hdri/2k/hdr /tmp/assets/sky.hdr
          fetch painted_plaster_wall Diffuse/2k/jpg /tmp/assets/siding/diff.jpg
          fetch painted_plaster_wall Rough/2k/jpg /tmp/assets/siding/rough.jpg
          fetch metal_plate Rough/2k/jpg /tmp/assets/roof/rough.jpg
          fetch concrete_floor_worn_001 Diffuse/2k/jpg /tmp/assets/concrete/diff.jpg
          fetch concrete_floor_worn_001 Rough/2k/jpg /tmp/assets/concrete/rough.jpg

      - name: Render shard ${{ matrix.shard }}
        run: |
          set -euo pipefail
          HDRI_FLAG=""; [ -s /tmp/assets/sky.hdr ] && HDRI_FLAG="--hdri /tmp/assets/sky.hdr --hdri-rotation 120"
          python scripts/model/render-turntable.py /tmp/model/source.raw.glb /tmp/frames \
            --orbit "${{ github.event.inputs.frames }}" --plan "${{ github.event.inputs.plan_frames }}" --samples "${{ github.event.inputs.samples }}" \
            --north "${{ needs.convert.outputs.north }}" --width 1440 --height 900 \
            --style studio --textures /tmp/assets $HDRI_FLAG --shard ${{ matrix.shard }}/6
          ls /tmp/frames | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.shard }}
          path: /tmp/frames
          retention-days: 3

  env:
    if: ${{ github.event.inputs.env == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Web-sized environment map for the raster viewer
        run: |
          set -euo pipefail
          python -m pip install -q "numpy<2"
          url=$(curl -sS "https://api.polyhaven.com/files/$SKY_ID" | python -c 'import json,sys,functools; print(functools.reduce(lambda a,k: a[k], sys.argv[1].split("/"), json.load(sys.stdin))["url"])' hdri/2k/hdr)
          curl -sS -L -o /tmp/sky.hdr "$url"
          # the same rotation render-turntable gets (--hdri-rotation 120) so shadows and reflections line up across viewers
          python scripts/model/prep-env.py /tmp/sky.hdr public/models/env --width 512 --rotation 120
          cat public/models/env/env.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/models/env
          git diff --cached --quiet && { echo "env unchanged"; exit 0; }
          git commit -q -m "models: web environment map for the plan viewer (Poly Haven sky)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main

  encode:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: /tmp/shards
      - name: Merge the shards and encode
        run: |
          set -euo pipefail
          SLUG="${{ github.event.inputs.slug }}"
          FRAMES_DIR="${{ github.event.inputs.frames_dir }}"; FRAMES_DIR="${FRAMES_DIR:-public/models/$SLUG/turntable}"
          mkdir -p /tmp/frames
          for d in /tmp/shards/frames-*; do cp "$d"/*.png /tmp/frames/; cp "$d"/manifest.json /tmp/frames/manifest.json; done
          echo "$(ls /tmp/frames/*.png | wc -l) frames merged"
          npm install --no-save sharp > /dev/null 2>&1
          rm -rf "$FRAMES_DIR"
          node scripts/model/encode-frames.mjs /tmp/frames "$FRAMES_DIR"
          du -sh "$FRAMES_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$FRAMES_DIR"
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "models: $SLUG turntable frames (Cycles render)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
