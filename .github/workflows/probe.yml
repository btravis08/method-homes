name: probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump intake survey form fields
        run: |
          cat > dump.py <<'PY'
          import sys, re
          from html.parser import HTMLParser
          KEEP = {"form","label","input","select","option","textarea","h1","h2","h3","h4","h5","h6","legend","fieldset","iframe","script","button","div","span","p"}
          class P(HTMLParser):
              def __init__(s): super().__init__(); s.inform=0; s.stack=[]; s.out=[]; s.cur=None
              def handle_starttag(s, t, a):
                  a=dict(a)
                  if t=="iframe" or (t=="script" and a.get("src") and re.search(r"typeform|hubspot|jotform|hsforms|tally|form", a.get("src",""), re.I)):
                      s.out.append(f"[{t}] src={a.get('src')}")
                  if t=="form": s.inform+=1; s.out.append(f"== FORM id={a.get('id')} name={a.get('name')} data-name={a.get('data-name')} action={a.get('action')}")
                  if not s.inform: return
                  if t in ("input","select","textarea","option","label","button"):
                      keep={k:v for k,v in a.items() if k in ("name","type","value","placeholder","data-name","for","id","required","selected")}
                      s.out.append(f"<{t}> {keep}")
                  s.cur=t
              def handle_endtag(s, t):
                  if t=="form": s.inform-=1; s.out.append("== /FORM")
              def handle_data(s, d):
                  d=" ".join(d.split())
                  if s.inform and d: s.out.append(f"   text: {d}")
          for url in sys.argv[1:]:
              import urllib.request
              req=urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              html=urllib.request.urlopen(req, timeout=30).read().decode("utf-8","replace")
              html=re.sub(r"<style.*?</style>","",html,flags=re.S)
              p=P(); p.feed(html)
              print("#"*20, url, "bytes", len(html))
              print("\n".join(p.out))
              for m in re.findall(r'<(?:iframe|script)[^>]+src="([^"]+)"', html):
                  if re.search(r"typeform|hubspot|jotform|hsforms|tally|paperform|formstack|cognito", m, re.I): print("EMBED:", m)
          PY
          python3 dump.py https://www.methodhomes.net/residential-survey https://www.methodhomes.net/commercial-survey
